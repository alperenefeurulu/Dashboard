function bb(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function anahtar(parola){
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(parola),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:bb(V.tuz),iterations:V.tur,hash:"SHA-256"},k,256));
}
async function coz(ham){
  var k=await crypto.subtle.importKey("raw",ham,"AES-GCM",false,["decrypt"]);
  var d=await crypto.subtle.decrypt({name:"AES-GCM",iv:bb(V.iv)},k,bb(V.veri));
  var html=new TextDecoder().decode(d);
  var c=document.createElement("iframe");c.setAttribute("title","Rehber");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505";c.srcdoc=html;document.body.innerHTML="";document.body.style.margin="0";document.body.style.background="#050505";document.body.appendChild(c);
}
function sakla(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
function al(k){try{return localStorage.getItem(k)}catch(e){return null}}
(async function(){
  var s=al("alef-anahtar");
  if(s){try{await coz(bb(s));return}catch(e){sakla("alef-anahtar",null)}}
})();
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var hata=document.getElementById("hata");hata.textContent="Açılıyor…";
  try{
    var ham=await anahtar(document.getElementById("p").value);
    var b=btoa(String.fromCharCode.apply(null,ham));
    var hatirla=document.getElementById("h").checked;
    await crypto.subtle.decrypt({name:"AES-GCM",iv:bb(V.iv)},await crypto.subtle.importKey("raw",ham,"AES-GCM",false,["decrypt"]),bb(V.veri));
    sakla("alef-anahtar",hatirla?b:null);
    await coz(ham);
  }catch(err){hata.textContent="Parola yanlış."}
});
